    <script type="text/javascript">
        $(function () {
            var config = {
                'company': '钦州车务段接发车作业全流程追踪',
                'position': '{"jobTitle":"钦州港站调","departments":"钦州车务段,钦州港"},{"jobTitle":"钦州港站调","departments":"所有部门"},{"jobTitle":"所有职务","departments":"所有部门"},{"jobTitle":"所有职务","departments":"钦州车务段"},{"jobTitle":"所有职务","departments":"钦州车务段,钦州港"}',
                'srole': '',
                'loginImageID4FS': '',
                'logoImageID4FS': '',
                'backgroundImageID': '',
                'homePageUrl': 'ReportServer?formlet=demo/homepage/finereport.frm&fr_check_url=Tue Sep 01 07:43:12 CST 2026',
                'roots': FR.jsonDecode('{"modules":[]}'),
                'hasRegistePrivilege': 'false',
                'isTableDataUser': 'false',
                'hasbi': '',
                'isRegiste': FR.jsonDecode('true'),
                'registerMail': 'business@finereport.com',
                'registerUrl': 'http://www.finereporthelp.com/help/resources/regist.html',
                'pluginRegisterUrl' : '',
                'isLicExist': 'true',
                'isSMSEnabled': 'false',
                'username': '钦州港站调',
                'isAdmin': FR.jsonDecode('false'),
                'forceMessage': FR.jsonDecode('true'),
                'ismobilebinddev': 'false',
                'gradeAuthority': FR.jsonDecode('false'),
                'templatePrivilegeType': '-1',
                'dataConnectionAuthority': FR.jsonDecode('false'),
                'hasGradeAuthority': FR.jsonDecode('true'),
                'editReportAuthority': FR.jsonDecode('false'),
                'departmentAllID': '30',
                'postAllID': '47',
                'userLimit': FR.jsonDecode('9999'),
                'mobileUserAuthLimit': FR.jsonDecode('0'),
                'ssLoginHeartbeat': FR.jsonDecode('true'),
                'isBackgroundImg': FR.jsonDecode('true'),
                'backgroundColor': 'rgb(38,77,132)',
                'bannerType': FR.jsonDecode('2'),
                'theme': FR.jsonDecode('{"isCustom":false,"name":"default"}'),
                'folderIcons': FR.jsonDecode('{"112":"e642","113":"e642","114":"e642","99":"e642","108":"e642","110":"e642","111":"e642"}'),
                'serverID': '',
                'serverAttr': FR.jsonDecode('{"envVersion":"9.0","isPack":false,"isJetty":false}')
            };
            FS._init(config);

            var numFormat = function (n) {
                if (n < 10) {
                    return '0' + n;
                } else {
                    return n;
                }
            };
            var dateFormat = function (date) {
                var o = {
                    year: date.getFullYear(), //年
                    month: numFormat(date.getMonth() + 1), //月份
                    day: numFormat(date.getDate()), //日
                    hours: numFormat(date.getHours()), //小时
                    minutes: numFormat(date.getMinutes()), //分
                    seconds: numFormat(date.getSeconds()) //秒
                };

                return o.year + '-' + o.month + '-' + o.day + ' ' + o.hours + ':' + o.minutes + ':' + o.seconds;
            };

            $(document).ready(function () {
                var at, ip, city, systemMsg, isShow;
                if (FR.CookieInfor.getCookieByName('lastLoginedAt')) {
                    at = new Date(+FR.CookieInfor.getCookieByName('lastLoginedAt'));
                    ip = FR.CookieInfor.getCookieByName('lastLoginedIp');
                    city = FR.CookieInfor.getCookieByName('lastLoginedCity');
                    if (city && city.indexOf("%") === -1) {
                        city = escape(city)
                    }
                    city = decodeURI(city);
                    isShow = FR.CookieInfor.getCookieByName('lastLoginedShow');
                    FR.CookieInfor.removeCookie('lastLoginedAt');
                    FR.CookieInfor.removeCookie('lastLoginedIp');
                    FR.CookieInfor.removeCookie('lastLoginedCity');
                    FR.CookieInfor.removeCookie('lastLoginedShow');
                    if (ip === '0:0:0:0:0:0:0:1') {
                        ip = 'localhost';
                    }
                }
                if (FR.CookieInfor.getCookieByName('systemMsg')) {
                    systemMsg = FR.CookieInfor.getCookieByName('systemMsg');
                    FR.CookieInfor.removeCookie('systemMsg');
                }
                if (at && ip && isShow === "true") {
                    $("body").append($(
                        '<div id="pop_div"\n' +
                        '     style="position:absolute;z-index: 999;width: 400px;height: 190px;right: 10px;bottom: 10px;background: white;border: 1px solid #DDDDDD;">\n' +
                        '    <div style="width: 385px;height: 20px;background: #048BED;font-size: 14px;padding: 5px;padding-left: 10px;color: white;"> ' + FR.i18nText('FS-Msg-New_Message') + '\n' +
                        '        <div id="lastloginclose" style="float:right; margin-right:5px; width:20px; height:20px; "></div>\n' +
                        '    </div>\n' +
                        '    <div class="last-login-info-icon" style="position: absolute;left: 50px;top: 50px;width: 34px;height: 34px;"></div>\n' +
                        '    <div style="font-size: 20px;left: 100px;top: 52px;position: absolute;color: #666666;">' + FR.i18nText('FS-System-Last_Logined_Info_Popup') + '</div>\n' +
                        '    <div style="font-size: 15px;left: 100px;top: 90px;position: absolute;color: #999999;">' + FR.i18nText('FS-System-Time') + '：</div>\n' +
                        '    <div style="font-size: 15px;left: 200px;top: 90px;position: absolute;color: #999999;">' + dateFormat(at) + '</div>\n' +
                        '    <div style="font-size: 15px;left: 100px;top: 111px;position: absolute;color: #999999;">' + FR.i18nText('FS-System-IP_Address') + '：</div>\n' +
                        '    <div style="font-size: 15px;left: 200px;top: 111px;position: absolute;color: #999999;">' + ip + '</div>\n' +
                        '    <div style="font-size: 15px;left: 100px;top: 132px;position: absolute;color: #999999;">' + FR.i18nText('FS-System-Last_Login_Location') + '：</div>\n' +
                        '    <div style="font-size: 15px;left: 200px;top: 132px;position: absolute;color: #999999;">' + city + '</div>\n' +
                        '</div>'
                    ));
                    $('#lastloginclose').css(
                        'background', "url('/WebReport/ReportServer?op=resource&resource=/com/fr/web/core/widget/images/close.png') no-repeat center"
                    );
                    $('.last-login-info-icon').css(
                        'background', "url('/WebReport/ReportServer?op=resource&resource=/com/fr/fs/resources/images/time.png') no-repeat"
                    );
                    $('#pop_div').fadeIn(400);
                    setTimeout("$('#pop_div').fadeOut(400);", 3000);
                    $('#lastloginclose').click(function () {
                        $('#pop_div').fadeOut(400);
                    });
                }
                if (systemMsg === 'true') {
                    var message = {
                        "user": FR.CookieInfor.getCookieByName('fr_username'),
                        "message": FR.i18nText('FS-System-First_Login_Info'),
                        "messagetype": "system_message",
                        "terminal": 1,
                        url: 'email_setting'

                    };
                    var target = this;
                    var messageType = message.messagetype;
                    var form = target.options ? target.options.form : null;
                    var formParameters = form ? form.collectionValue() : {};
                    var postData = {
                        op: "fs_main",
                        cmd: "save_message",
                        message: message
                    };
                    if (FR.SessionMgr.getSessionID()) {
                        $.extend(postData, {
                            sessionID: FR.SessionMgr.getSessionID(),
                            __parameters__: formParameters
                        });
                    }
                    FR.ajax({
                        url: FR.servletURL,
                        async: true,
                        type: 'POST',
                        data: postData
                    });
                }
                FS.Plugin.SystemMsgActionProvider.items.push({
                    version:1.0,
                    url: 'email_setting',
                    action: function() {
                        // id: 5， 系统设置
                        var systemManagerModule = {
                            text: FR.i18nText("FS-Module-Server_Setting"),
                            id: 5,
                            isModule: true
                        };
                        FS.Design.showDesign(systemManagerModule);
                        // tabindex: 4 邮箱设置
                        $('[tabindex=4]').click();
                    }
                })
            });
        });
    </script>
