<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>股道存车</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================= 工具栏 ================= -->
<div class="toolbar">
  <svg class="brand-emblem" viewBox="0 0 64 64" width="26" height="26" aria-label="铁路路徽" role="img">
    <circle cx="32" cy="32" r="30" fill="#1f6feb" stroke="#1453b8" stroke-width="2"/>
    <!-- 上方展翼：象征铁道 -->
    <path d="M14 26 C22 18 42 18 50 26 L46 30 C40 25 24 25 18 30 Z" fill="#fff"/>
    <!-- 中央“人”字 -->
    <path d="M32 24 L40 44 L34 44 L32 38 L30 44 L24 44 Z" fill="#fff"/>
    <!-- 底部钢轨线 -->
    <rect x="18" y="46" width="28" height="3" rx="1.5" fill="#fff"/>
  </svg>
  <span class="title">站存车统计</span>

  <button class="btn" id="btnPickFolder" title="选择数据文件夹" style="display:none">选择数据文件夹</button>
  <button class="btn" id="btnReload" title="刷新数据">刷新</button>

  <span class="spacer"></span>

  <button class="btn toggle" id="btnToggleVirtual" aria-pressed="true">隐藏非常用股道</button>

  <button class="btn" id="btnAutoFitCols">自适应列宽</button>

  <div class="menu-wrap">
    <button class="btn" id="btnMenu">功能 ▾</button>
    <div class="menu-list" id="menuList" style="display:none">
      <div class="menu-item" id="menu31814" data-action="31814">站存计算</div>
      <div class="menu-item" id="menuSettings" data-action="settings">
        <svg class="menu-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
          <path d="M13.3 5.2l1.1-2.1L13 1.7l-2.1 1.1a5.5 5.5 0 0 0-1.3-.4L9.2 0H6.8l-.4 2.3a5.5 5.5 0 0 0-1.3.4L3 1.7 1.6 3.1l1.1 2.1a5.5 5.5 0 0 0 0 1.6L1.6 8.9 3 10.3l2.1-1.1a5.5 5.5 0 0 0 1.3.4L6.8 12h2.4l.4-2.3a5.5 5.5 0 0 0 1.3-.4l2.1 1.1L14.4 8.9l-1.1-2.1a5.5 5.5 0 0 0 0-1.6zM8 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" fill="currentColor"/>
        </svg>
        设置
      </div>
    </div>
  </div>
</div>

<!-- ================= 表格 ================= -->
<div class="table-wrap">
  <table class="grid" id="grid">
    <thead>
      <tr id="headRow"></tr>
    </thead>
    <tbody id="tbody"></tbody>
    <tfoot id="tfoot"></tfoot>
  </table>
</div>

<!-- ================= 状态栏 ================= -->
<div class="statusbar">
  <span class="stat">股道 <b id="stTrack">0</b></span>
  <span class="stat">车数 <b id="stCount">0</b></span>
  <span class="stat">换长 <b id="stLen">0</b></span>
  <span class="stat">载重 <b id="stLoad">0</b></span>
  <span class="stat">老牌车 <b id="stOld">0</b></span>
  <span class="msg" id="stMsg"></span>
</div>

<!-- ================= 31814 统计浮窗（左右布局） ================= -->
<div class="modal" id="modal31814">
  <div class="modal-content rpt31814">
    <div class="modal-head">
      <h3 id="rptTitle">站存计算</h3>
      <span class="spacer">
        <span class="rpt-zoom">
          <button class="btn icon-btn" id="rptZoomOut" title="缩小表格字体">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
              <circle cx="6.6" cy="6.6" r="4.7" fill="none" stroke="currentColor" stroke-width="1.6"/>
              <line x1="3.8" y1="6.6" x2="9.4" y2="6.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <line x1="10.3" y1="10.3" x2="14.2" y2="14.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
          <span class="rpt-fs-val" id="rptFsVal">15px</span>
          <button class="btn icon-btn" id="rptZoomIn" title="放大表格字体">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
              <circle cx="6.6" cy="6.6" r="4.7" fill="none" stroke="currentColor" stroke-width="1.6"/>
              <line x1="3.8" y1="6.6" x2="9.4" y2="6.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <line x1="6.6" y1="3.8" x2="6.6" y2="9.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <line x1="10.3" y1="10.3" x2="14.2" y2="14.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </span>
      </span>
      <button class="btn" id="rptCopyImg" title="将结果表格截图复制到剪切板">截图</button>
      <button class="btn" id="rptClose">关闭</button>
    </div>
    <div class="rpt31814-body">
      <!-- 左侧：结果 -->
      <div class="rpt-left" id="rptBody"></div>
      <!-- 右侧：条件面板 -->
      <div class="rpt-right" id="cfgPanel"></div>
    </div>
  </div>
</div>

<!-- ================= 设置浮窗 ================= -->
<div class="modal" id="modalSettings">
  <div class="modal-content settings-modal">
    <div class="modal-head">
      <h3>设置</h3>
      <span class="spacer"></span>
      <button class="btn" id="btnSettingsClose">关闭</button>
    </div>
    <div class="modal-body">
      <div class="setting-row">
        <label class="setting-label">主页表格字体大小</label>
        <div class="setting-control">
          <div class="range-wrap">
            <div class="range-ticks upper">
              <span class="tick" style="left:16.67%">10</span>
              <span class="tick" style="left:50%">14</span>
              <span class="tick" style="left:83.33%">18</span>
            </div>
            <input type="range" id="gridFontSize" min="8" max="20" value="12" step="1" list="fsTicks">
            <datalist id="fsTicks">
              <option value="8" label="8"></option>
              <option value="12" label="12"></option>
              <option value="16" label="16"></option>
              <option value="20" label="20"></option>
            </datalist>
            <div class="range-ticks">
              <span class="tick" style="left:0%">8</span>
              <span class="tick" style="left:33.33%">12</span>
              <span class="tick" style="left:66.67%">16</span>
              <span class="tick" style="left:100%">20</span>
            </div>
          </div>
          <span class="setting-val" id="gridFontSizeVal">12px</span>
        </div>
      </div>
      <div class="setting-divider"></div>
      <div class="setting-row">
        <label class="setting-label">默认数据文件夹</label>
        <div class="setting-folder">
          <span class="folder-path" id="folderPath">未设置</span>
          <button class="btn" id="btnSettingFolder">修改</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ================= 明细抽屉 ================= -->
<div class="drawer-mask" id="drawerMask"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3 id="drawerTitle">股道明细</h3>
    <span class="spacer"></span>
    <button class="btn" id="btnPrevTrack">上一股道</button>
    <button class="btn" id="btnNextTrack">下一股道</button>
    <button class="btn" id="btnCloseDrawer">关闭</button>
  </div>
  <div class="drawer-body">
    <table class="detail" id="detailTable">
      <thead><tr id="detailHead"></tr></thead>
      <tbody id="detailBody"></tbody>
    </table>
  </div>
</div>

<!-- ================= 地图（iframe 嵌入 Map/chinamap.html） ================= -->
<div class="map-mask" id="mapMask">
  <div class="map-panel">
    <div class="map-head">
      <h3 id="mapTitle">径路</h3>
      <span class="map-status" id="mapStatus"></span>
      <span class="spacer"></span>
      <button class="btn" id="mapClear">清除径路</button>
      <button class="btn" id="mapClose">关闭</button>
    </div>
    <div class="map-body">
      <iframe id="mapFrame" src="about:blank" frameborder="0"></iframe>
      <div class="map-loading" id="mapLoading">
        <div class="spinner"></div>
        <div id="mapLoadingText">地图初始化中，请稍候…</div>
      </div>
    </div>
  </div>
</div>

<!-- ================= 覆盖层 ================= -->
<div class="toast" id="toast"></div>
<div class="loading" id="loading">
  <div class="spinner"></div>
  <div id="loadingText">正在解析…</div>
</div>

<!-- 兜底：普通文件选择（任何浏览器都可用） -->
<input type="file" id="fileInputMulti" accept=".xls,.xlsx" multiple style="display:none">

<!-- ================= 依赖 ================= -->
<script src="js/utils.js" charset="utf-8"></script>
<script src="js/store.js" charset="utf-8"></script>
<script src="js/ui.js" charset="utf-8"></script>
<script src="js/col-resize.js" charset="utf-8"></script>
<script src="track.config.js" charset="utf-8"></script>
<script src="direction.data.js" charset="utf-8"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/aggregate.js" charset="utf-8"></script>
<script src="js/map-bridge.js" charset="utf-8"></script>
<script src="js/report31814.js" charset="utf-8"></script>
<script src="js/app.js" charset="utf-8"></script>

</body>
</html>
