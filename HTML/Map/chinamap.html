    <script>

        //web服务返回值
        var map_version = null;
        //Token 可用性：undefined=未判定 true=后端正常(可发API) false=后端不可达(直接用本地数据/计算)
        var apiAvailable = undefined;
        var map_width = null;
        var map_height = null;
        var lj_color_list = null;
        var depart_name = "\u5357\u5B81\u5C40";
        var role_name = "\u5F84\u8DEF\u67E5\u8BE2\u7528\u6237";

        //地图初始化（创建 Map/Search/Jl 等对象）；由 getVersion 成功/失败两处择一触发
        function initMap() {
            if (map_version == null) return;                          //版本号未就绪，等请求回调再来触发
            if (typeof map !== "undefined" && map) return;            //避免重复初始化

            //打开地图
            map = new Map($("svg").height(), $("svg").width());
            map.createMap();

            //数据检索
            search = new Search();

            //点到点径路
            jl = new Jl();
        }

        //获得token
        var getToken;

        $(document).ready(function () {
            getToken = new GetToken();

            //设置DIV_SVG宽度（无左侧菜单，占满窗口）
            var right_svg_width = $(window).width();
            $(".right_svg").width(right_svg_width);

            //设置DIV_SVG高度
            var right_svg_height = $(window).height() - $(".top").height();
            $(".right_svg").height(right_svg_height);

            //右上角登陆信息
            $(".pclass").html(depart_name + "[" + role_name + "]");

        });
    </script>

                <script>

                    // map_version 不再硬编码，由页面顶部 requestVersion() 请求获取并赋值给全局变量
                    var map_width = 1521;
                    var map_height = 932;
                    var lj_color_list = ["#000000", "#ef4136", "#00FF00", "#ef4136", "#22CEFF", "#f47920", "#00FF00", "#22CEFF", "#ef4136", "#22CEFF", "#ef4136", "#00FF00", "#ef4136", "#22CEFF", "#00FF00", "#ef4136", "#22CEFF", "#00FF00", "#ef4136"];

                    //设置MapVersion（版本号由顶部 requestVersion() 请求成功后写入 .right_version）

                    var map;                //地图对象
                    var search;             //检索对象
                    var jl;                 //点到点径路

                    //工具栏车站搜索框：输入时实时匹配（带防抖 + 输入法组字期间不触发）
                    var _stationInputTimer = null;
                    var _stationComposing = false;
                    function onStationInput() {
                        if (_stationComposing) return;            //输入法组字过程中不触发，避免卡顿/闪烁
                        if (_stationInputTimer) clearTimeout(_stationInputTimer);
                        _stationInputTimer = setTimeout(function () {
                            if (search) search.stationInputSearch();
                        }, 200);
                    }
                    function onStationFocus() {
                        if (_stationComposing) return;
                        //聚焦时若输入框为空，立即展示最近搜索记录
                        if (!$("#stationSearchInput").val().trim() && search) search.stationInputSearch();
                    }
                    function onStationEnter() {
                        //回车：若当前已收敛为唯一候选，直接确认生成径路；否则走正常匹配
                        if (search && search.submitIfUnique && search.submitIfUnique()) return;
                        onStationInput();
                    }
                    function onStationInputCompositionStart() { _stationComposing = true; }
                    function onStationInputCompositionEnd()   { _stationComposing = false; onStationInput(); }

                    $(document).ready(function () {

                        //屏蔽右键菜单
                        $(document).bind("contextmenu", function (e) {
                            return false;
                        });

                        // 调整页面大小
                        $(window).resize(function () {
                            //设置DIV_SVG宽度（无左侧菜单，占满窗口）
                            var right_svg_width = $(window).width();
                            $(".right_svg").width(right_svg_width);

                            //设置DIV_SVG高度
                            var right_svg_height = $(window).height() - $(".top").height();
                            $(".right_svg").height(right_svg_height);

                            //设置SVG高度
                            $("svg").width(right_svg_width);

                            //设置SVG高度
                            $("svg").height(right_svg_height - $(".right_svg_version").height() - $(".right_svg_prompt").height());

                            //设置Jl_INPUT
                            /*var jl_width = parseInt( $(".right_svg_jl").width());
                            $(".right_svg_jl").css("margin-left", right_svg_width - jl_width);*/
                        });

                        //设置DIV_SVG宽度
                        var right_svg_width = $(".right_svg").width();

                        //设置DIV_SVG高度
                        var right_svg_height = $(".right_svg").height();

                        //设置SVG高度
                        $("svg").width(right_svg_width);

                        //设置SVG高度
                        $("svg").height(right_svg_height - $(".right_svg_version").height() - $(".right_svg_prompt").height());

                        //打开地图（依赖 map_version，initMap 内部已做版本号非空保护；版本号请求在页面顶部已提前发出）
                        initMap();


                        $(".btn-group span").mouseover(function () {
                            $(this).css({ "background-color": "#505050" }, 500);
                        }).mouseout(function () {
                            $(this).css({ "background-color": "#3c3f41" }, 500);
                        });
                        $(".btn-group span").mousedown(function () {
                            $(this).css("color", "#4A4A4A");
                        }).mouseup(function () {
                            $(this).css({ "color": "white" }, 500);
                        })

                    });

                    //监测键盘Ctrl+Z
                    $(document).on("keypress", function (e) {
                        if (e.ctrlKey && e.which == 26)         //ctrl + z
                        {
                            //点点回退
                            if (jl.getJlState() == 1) {
                                //执行回退
                                jl.undoJl();
                                return;
                            }
                        }
                    });


                </script>

                        <div class="search_wrap" style="position:relative; display:inline-block; vertical-align:middle; margin-right:5px;">
                            <input type="text" id="stationSearchInput" placeholder="输入终点站名/电报码/拼音首字母(起点:钦州港)" style="padding: 2px 26px 2px 5px; border-radius: 3px; border: 1px solid #ccc; vertical-align: middle; color:#333; background:#fff;" oninput="onStationInput()" onfocus="onStationFocus()" onkeydown="if(event.keyCode===13){onStationEnter();}" oncompositionstart="onStationInputCompositionStart()" oncompositionend="onStationInputCompositionEnd()">
